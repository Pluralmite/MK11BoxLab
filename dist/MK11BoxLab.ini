; size of the advanced settings window text
MenuScale=1.0
; Virtual-key codes (0x71=F2 0x72=F3 0x74=F5 0x75=F6)
MenuKey=0x71
BoxesKey=0x72
PauseKey=0x74
StepKey=0x75

[Colors]
; RRGGBBAA
Hurt=3C8CFFB4
Hit=FF3030D0
